<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>3D_webGL</title>
    <style>
        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        body {
            margin: 0px;
            padding: 0px;
            touch-action: none;
        }
        canvas {
            background: #00000000;
            display: block;
        }
        button {
            position: fixed;
            flex-shrink: 0;
            border-radius: 10px;
        }
        #glcanvas {
            position: absolute;
            top: 0px;
            left: 0px;
            z-index: 1;
        }
        #canvas {
            position: absolute;
            top: 0px;
            left: 0px;
            z-index: 2;
        }
        .hidden {
            display: none !important;
        }
        #breakB {
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            z-index: 3;
            background-color: #00000080;
            font-weight: bold;
            font-size: 40px;
            color: #ffffff;
        }
        #kisyuB {
            top: 40px;
            right: 40px;
            width: 120px;
            height: 60px;
            z-index: 4;
            background-color: #00000080;
            font-weight: bold;
            font-size: 40px;
            color: #ffffff;
        }
        #jump {
            bottom: 40px;
            right: 40px;
            width: 120px;
            height: 120px;
            z-index: 5;
            background-color: #00000080;
            font-weight: bold;
            font-size: 40px;
            color: #ffffff;
        }
        #w, #a, #s, #d {
            width: 120px;
            height: 120px;
            background-color: #00000080;
            font-weight: bold;
            font-size: 40px;
            color: #ffffff;
        }
        #w {
            bottom: 170px;
            left: 300px;
            z-index: 6;
        }
        #a {
            bottom: 40px;
            left: 170px;
            z-index: 7;
        }
        #s {
            bottom: 40px;
            left: 300px;
            z-index: 8;
        }
        #d {
            bottom: 40px;
            left: 430px;
            z-index: 8;
        }
    </style>
</head>

<body>
    <div>
        <canvas id="glcanvas"></canvas>
        <canvas id="canvas"></canvas>
    </div>
    <div>
        <button id="kisyuB" type="button">機種</button>
        <button id="breakB" type="button">壊す</button>
        <button id="jump" type="button">ジャンプ</button>
        <button id="w" type="button">w</button>
        <button id="a" type="button">a</button>
        <button id="s" type="button">s</button>
        <button id="d" type="button">d</button>
    </div>

    <script src="minMatrix.js"></script>
    <script src="chunk.js"></script>
    <script src="move.js"></script>
    <script src="draw.js"></script>
    <script src="block.js"></script>
    <script src="button.js"></script>
    <script src="main.js"></script>
</body>

</html>
