<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>3D_webGL</title>
    <style>
        body {
            margin: 0px;
            padding: 0px;
        }
        canvas {
            background: #00000000;
            display: block;
        }
        #glcanvas {
            position: absolute;
            top: 0px;
            left: 0px;
            z-index: 1;
        }
        #canvas {
            position: absolute;
            top: 0px;
            left: 0px;
            z-index: 2;
        }
        #breakB {
            position: absolute;
            top: 100px;
            left: 120px;
            width: 60;
            height: 20;
            z-index: 3;
        }
    </style>
</head>

<body>
    <div>
        <canvas id="glcanvas"></canvas>
        <canvas id="canvas"></canvas>
    </div>
    <div>
        <button id="breakB" type="button">壊す</button>
    </div>

    <script src="minMatrix.js"></script>
    <script src="chunk.js"></script>
    <script src="move.js"></script>
    <script src="draw.js"></script>
    <script src="block.js"></script>
    <script src="button.js"></script>
    <script src="main.js"></script>
</body>

</html>
